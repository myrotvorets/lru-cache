# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build and Test

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Node ${{ matrix.node.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - { name: Current,      version: current }
          - { name: LTS,          version: lts/* }
          - { name: Previous LTS, version: lts/-1 }
    steps:
      - name: Build and test
        uses: myrotvorets/composite-actions/build-test-nodejs@d48d1c16e5782ea32f56fe24da600ca2028ed8b1 # master
        with:
          node-version: ${{ matrix.node.version }}

  lint:
    name: Check Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Run code style check
        uses: myrotvorets/composite-actions/node-run-script@d48d1c16e5782ea32f56fe24da600ca2028ed8b1 # master
        with:
          script: lint

  typecheck:
    name: Check Types
    runs-on: ubuntu-latest
    steps:
      - name: Run type check
        uses: myrotvorets/composite-actions/node-run-script@d48d1c16e5782ea32f56fe24da600ca2028ed8b1 # master
        with:
          script: typecheck
